[build]
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m uvicorn src.api.server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
# Models take ~60s to load on first start; give the container 5 minutes
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
